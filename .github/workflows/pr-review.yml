name: Automated Pull Request Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reviewer
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run automated review
        id: review
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pr_review.cli \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --fail-on-error \
            --output pr-review.md
          cp pr-review.md "$GITHUB_STEP_SUMMARY"

      - name: Comment review summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file pr-review.md

      - name: Fail pull request for security errors
        if: steps.review.outcome == 'failure'
        run: exit 1
